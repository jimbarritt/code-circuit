name: Release

# Creates a release when a push to main carries a package version with no release yet.
# To release, bump "version" in package.json, commit and push to main. The workflow:
#
# 1. Reads the version from package.json. When the tag `v<version>` already exists, it
#    stops: the push is not a release.
# 2. Verifies the commit: `bun test` passes with the locked dependencies. A failure stops
#    the release before it creates a tag.
# 3. Creates the tag on the pushed commit and the GitHub release `ccircuit <version>`.
#    The notes are the subject of every commit since the previous `v*` tag, then the
#    compare link GitHub generates.
# 4. Builds the binary with `bun build --compile` for macOS and Linux and attaches one
#    archive per platform to the release. The macOS binaries build on macOS runners so
#    that bun signs them. Apple silicon refuses to run an unsigned binary.
# 5. Writes Formula/ccircuit.rb in jimbarritt/homebrew-tap, so that
#    `brew install jimbarritt/tap/ccircuit` installs that release.
#
# Archives: ccircuit-<version>-<target>.tar.gz, holding the `ccircuit` binary at the root.
#
# The formula job needs the secret HOMEBREW_TAP_TOKEN in the environment `release`: a
# fine-grained personal access token with read and write access to the contents of
# jimbarritt/homebrew-tap.
#
# The run from the Actions tab takes a tag, for a release whose binaries or formula
# failed. It builds and attaches the binaries and writes the formula again.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build again, for example v0.1.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the package version and look for its tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no version in package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Run the tests
        run: bun test

  release:
    needs: [version, verify]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the tag and the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          {
            echo "## Commits"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            else
              git log --no-merges --format='- %s (%h)' HEAD
            fi
          } > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ccircuit $VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, release]
    # Runs after a new release, and on a manual run, where the release job is skipped.
    if: always() && needs.version.result == 'success' && (needs.release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            bun-target: bun-linux-arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: ${{ matrix.target }}
      BUN_TARGET: ${{ matrix.bun-target }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun build --compile --target="$BUN_TARGET" src/cli.ts --outfile ccircuit

      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="ccircuit-${TAG#v}-$TARGET.tar.gz"
          tar -czf "$archive" ccircuit
          gh release upload "$TAG" "$archive" --clobber

  formula:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check the token is set
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::the secret HOMEBREW_TAP_TOKEN is not set in the environment release"
            exit 1
          fi

      - name: Download the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ccircuit-*.tar.gz' --dir archives
          ls -l archives

      - name: Write the formula
        run: |
          version="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha() {
            sha256sum "archives/ccircuit-$version-$1.tar.gz" | cut -d ' ' -f 1
          }
          cat > ccircuit.rb <<RUBY
          class Ccircuit < Formula
            desc "Draw a service as a circuit board from a machine-readable data map"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            version "$version"

            on_macos do
              on_arm do
                url "$base/ccircuit-$version-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/ccircuit-$version-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$base/ccircuit-$version-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$base/ccircuit-$version-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "ccircuit"
            end

            test do
              assert_match "ccircuit #{version}", shell_output("#{bin}/ccircuit --version")
            end
          end
          RUBY
          cat ccircuit.rb

      - name: Push the formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/jimbarritt/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ccircuit.rb tap/Formula/ccircuit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ccircuit.rb
          if git diff --cached --quiet; then
            echo "Formula/ccircuit.rb already holds $TAG"
            exit 0
          fi
          git commit -m "ccircuit ${TAG#v}"
          git push origin HEAD
